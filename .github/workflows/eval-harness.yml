name: Eval Harness

on:
  push:
    paths:
      - 'agents/**'
      - 'get-shit-done/workflows/**'
      - 'get-shit-done/references/**'
      - 'get-shit-done/bin/eval-harness.js'
  pull_request:
    paths:
      - 'agents/**'
      - 'get-shit-done/workflows/**'
      - 'get-shit-done/references/**'
      - 'get-shit-done/bin/eval-harness.js'

jobs:
  eval-assert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node get-shit-done/bin/gsd-tools.js eval assert tests/fixtures/eval-project/golden-artifacts --raw
